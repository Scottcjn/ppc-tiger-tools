name: Smoke

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  repository-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Verify tracked tool sources exist
        run: |
          test -f README.md
          test -f rustchain_miner_ppc23.py
          test -f altivec_test.c
